sonar.organization=hamzahamidi
sonar.projectKey=hamzahamidi_gherkin-refine
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.eslint.reportPaths=eslint-report.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Every loop that awaits inside src is sequential on purpose: output order is part of the result contract.
sonar.issue.ignore.multicriteria=sequential
sonar.issue.ignore.multicriteria.sequential.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.sequential.resourceKey=src/**/*
