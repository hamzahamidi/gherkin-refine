name: Compatibility corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        artifact: [candidate, published]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - if: matrix.artifact == 'candidate'
        run: npm run compatibility:full
      - if: matrix.artifact == 'published'
        run: npm run compatibility:published
      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.artifact }}
          path: compatibility-report.json
          if-no-files-found: error
          retention-days: 14
