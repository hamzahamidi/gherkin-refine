name: Compatibility corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        artifact: [candidate, published]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - if: matrix.artifact == 'candidate'
        run: npm run compatibility:full
      - if: matrix.artifact == 'published'
        run: npm run compatibility:published
      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.artifact }}
          path: compatibility-report.json
          if-no-files-found: error
          retention-days: 14
