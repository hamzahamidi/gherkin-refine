name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.18.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 22.18.0
          - os: windows-latest
            node: 22.18.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node scripts/compatibility.mjs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - name: Check Sonar token
        id: sonar-token
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Report missing Sonar token
        if: steps.sonar-token.outputs.available != 'true'
        run: echo "::notice::Sonar analysis skipped because the SONAR_TOKEN repository secret is not set."
      - name: Generate ESLint report for SonarQube Cloud
        if: steps.sonar-token.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npx eslint src 'test/**/*.test.ts' --format json --output-file eslint-report.json
      - name: SonarQube Cloud Scan
        if: steps.sonar-token.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=hamzahamidi
            -Dsonar.projectKey=hamzahamidi_gherkin-refine
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.test.inclusions=test/**/*.test.ts
            -Dsonar.eslint.reportPaths=eslint-report.json
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      - name: Upload coverage report
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  codecov:
    name: Upload coverage to Codecov
    needs: coverage
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download coverage report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage
      - name: Upload coverage to Codecov
        if: steps.report.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          version: v11.3.1
          fail_ci_if_error: true
