name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Check tag and package version
        run: |
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          node -e 'if (process.env.RELEASE_TAG.slice(1) !== require("./package.json").version) process.exit(1)'
      - name: Check manual release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "$GITHUB_REF" = "refs/tags/$INPUT_RELEASE_TAG"
      - run: npm ci
      - run: npm run validate
      - run: npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check trusted publishing toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - id: package
        name: Pack release artifact
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const pack = Array.isArray(data) ? data[0] : data?.filename ? data : Object.values(data)[0]; if (!pack?.filename || !pack?.version) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${pack.filename}\nversion=${pack.version}\n`);' "$RUNNER_TEMP/pack.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        name: Generate SLSA provenance
        with:
          subject-path: ${{ runner.temp }}/${{ steps.package.outputs.filename }}
      - name: Download and verify SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        working-directory: ${{ runner.temp }}
        run: |
          gh attestation download "$PACKAGE_FILENAME" --repo "$GH_REPOSITORY" --predicate-type https://slsa.dev/provenance/v1
          bundle_path="sha256:$(sha256sum "$PACKAGE_FILENAME" | cut -d ' ' -f 1).jsonl"
          mv "$bundle_path" "$PACKAGE_FILENAME.intoto.jsonl"
          gh attestation verify "$PACKAGE_FILENAME" --repo "$GH_REPOSITORY" --bundle "$PACKAGE_FILENAME.intoto.jsonl" --signer-workflow "$GH_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$RELEASE_TAG"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign release artifact
        env:
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        run: cosign sign-blob --yes --bundle "$RUNNER_TEMP/$PACKAGE_FILENAME.sigstore.json" "$RUNNER_TEMP/$PACKAGE_FILENAME"
      - name: Publish package
        env:
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          registry_integrity="$(npm view "$package_name@$PACKAGE_VERSION" dist.integrity 2>/dev/null || true)"
          if [ -n "$registry_integrity" ]; then
            registry_tarball="$(npm view "$package_name@$PACKAGE_VERSION" dist.tarball)"
            python3 - "$RUNNER_TEMP/$PACKAGE_FILENAME" "$registry_tarball" <<'PY'
          import hashlib
          import io
          import sys
          import tarfile
          import urllib.request

          def manifest(source):
              if source.startswith(("http://", "https://")):
                  with urllib.request.urlopen(source) as response:
                      archive_bytes = response.read()
              else:
                  with open(source, "rb") as archive_file:
                      archive_bytes = archive_file.read()
              entries = {}
              with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as archive:
                  for member in archive.getmembers():
                      if member.isfile():
                          content = archive.extractfile(member)
                          if content is None:
                              raise SystemExit(f"Cannot read {member.name}")
                          entries[member.name] = ("file", member.mode, hashlib.sha256(content.read()).hexdigest())
                      elif member.issym() or member.islnk():
                          entries[member.name] = ("link", member.mode, member.linkname)
              return entries

          candidate = manifest(sys.argv[1])
          published = manifest(sys.argv[2])
          if candidate != published:
              print("Published package files differ from the release artifact.", file=sys.stderr)
              sys.exit(1)
          print("Published package files match the release artifact.")
          PY
          else
            npm publish "$RUNNER_TEMP/$PACKAGE_FILENAME" --access public
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        run: gh release create "$RELEASE_TAG" --repo "$GH_REPOSITORY" --title "$RELEASE_TAG" --notes-file CHANGELOG.md --verify-tag "$RUNNER_TEMP/$PACKAGE_FILENAME" "$RUNNER_TEMP/$PACKAGE_FILENAME.sigstore.json" "$RUNNER_TEMP/$PACKAGE_FILENAME.intoto.jsonl"
